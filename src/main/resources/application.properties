spring.application.name=inventario

# Active profile (override with -Dspring.profiles.active=prod)
spring.profiles.active=dev

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# CORS (will be refined per environment)
app.cors.allowed-origins=http://localhost:5173

# JWT
app.jwt.secret=CHANGE_ME_IN_PRODUCTION_USE_A_LONG_RANDOM_BASE64_SECRET_AT_LEAST_512_BITS
app.jwt.expiration-ms=86400000

# API docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
